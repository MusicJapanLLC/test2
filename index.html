<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GUILD∞ HD2D Prototype</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 9px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:5;pointer-events:none}.chip{background:linear-gradient(#1b1713ee,#0e0d0bee);border:1px solid #7f623b;border-radius:10px;padding:6px 7px;box-shadow:0 8px 25px #0009,inset 0 1px #ffffff12}.chip small{display:block;color:#ad8a58;font-size:8px;letter-spacing:.12em}.chip b{display:block;color:#ffe1a3;font-size:14px;margin-top:2px}#right{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 61px);display:flex;gap:7px;z-index:7}.round{width:42px;height:42px;border-radius:50%;border:1px solid #82633a;background:#17120ddd;color:#ffe0a1;font-weight:900;box-shadow:0 6px 18px #0008}#bottom{position:fixed;left:9px;right:9px;bottom:calc(env(safe-area-inset-bottom) + 9px);display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px;z-index:7}.btn{border:1px solid #8e6d3f;border-radius:12px;padding:12px 7px;background:linear-gradient(#d5a555,#9d7137);color:#1a1007;font-weight:1000;box-shadow:0 8px 25px #000b}.btn.alt{background:linear-gradient(#282119,#17130f);color:#f5d69b}.btn:active,.round:active{transform:translateY(1px) scale(.985)}#log{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 62px);width:min(58vw,330px);z-index:6;pointer-events:none}.msg{margin:4px 0;padding:6px 8px;background:#11100ddd;border:1px solid #725735;border-radius:8px;font-size:10px;color:#f2d8a8;animation:fade 3s forwards}@keyframes fade{0%{opacity:0;transform:translateY(-6px)}12%,78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-7px)}}#joy{position:fixed;width:112px;height:112px;border:1px solid #d1a15a4f;border-radius:50%;background:#090a0c88;display:none;z-index:9;pointer-events:none;box-shadow:inset 0 0 25px #000}#nub{position:absolute;width:40px;height:40px;left:36px;top:36px;border-radius:50%;background:#d4a35abc;border:1px solid #ffe0a5}#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);font-size:10px;color:#c9ae7f;background:#0d0d0ccc;border:1px solid #ffffff16;border-radius:999px;padding:5px 9px;z-index:6;pointer-events:none;white-space:nowrap}
</style></head>
<body><canvas id="c"></canvas>
<div id="hud"><div class="chip"><small>GOLD</small><b id="gold">100</b></div><div class="chip"><small>WOOD</small><b id="wood">30</b></div><div class="chip"><small>FOOD</small><b id="food">18</b></div><div class="chip"><small>GUILD</small><b id="level">Lv.1</b></div></div>
<div id="right"><button id="sound" class="round">♪</button><button id="speed" class="round">×1</button></div><div id="log"></div>
<div id="bottom"><button id="upgrade" class="btn">GUILD UP<br><small id="cost">120G</small></button><button id="hire" class="btn alt">HIRE<br><small>60G</small></button><button id="fever" class="btn alt">FEVER<br><small>20 sec</small></button></div>
<div id="joy"><div id="nub"></div></div><div id="hint">もう動いてる｜画面ドラッグで移動｜♪でBGM</div>
<script>
(()=>{"use strict";const c=document.getElementById("c"),x=c.getContext("2d",{alpha:false}),$=i=>document.getElementById(i);let W=innerWidth,H=innerHeight,D=1,last=performance.now(),cam={x:0,y:0},spd=1,fever=0,shake=0,T=0,ac=null,master=null,bgm=null,muted=false;const S={gold:100,wood:30,food:18,lv:1},P={x:0,y:120,vx:0,vy:0,dir:1,walk:0},parts=[],floats=[],npcs=[];const B=[{id:"guild",x:0,y:0,w:154,h:104,n:"GUILD HALL"},{id:"inn",x:-230,y:110,w:106,h:78,n:"INN"},{id:"quest",x:232,y:92,w:88,h:66,n:"QUEST"},{id:"forge",x:205,y:-135,w:102,h:74,n:"FORGE"},{id:"store",x:-210,y:-140,w:96,h:70,n:"MARKET"},{id:"tower",x:0,y:-205,w:76,h:102,n:"WATCH"}];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);x.imageSmoothingEnabled=false}addEventListener("resize",resize);resize();const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),sx=v=>W/2+v-cam.x,sy=v=>H/2+v-cam.y;function fmt(n){if(n>=1e9)return(n/1e9).toFixed(2)+"B";if(n>=1e6)return(n/1e6).toFixed(2)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return Math.floor(n)}function msg(s){const d=document.createElement("div");d.className="msg";d.textContent=s;$("log").appendChild(d);setTimeout(()=>d.remove(),3050)}function r(a,b,w,h,col){x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h))}function ln(a,b,c1,d,col,w=1){x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(a,b);x.lineTo(c1,d);x.stroke()}function tx(s,a,b,z=10,col="#fff"){x.font=`800 ${z}px ui-monospace,monospace`;x.textAlign="center";x.fillStyle="#000b";x.fillText(s,a+1,b+1);x.fillStyle=col;x.fillText(s,a,b)}function poly(p,col){x.fillStyle=col;x.beginPath();x.moveTo(...p[0]);for(let i=1;i<p.length;i++)x.lineTo(...p[i]);x.closePath();x.fill()}function sh(a,b,rx,ry,o=.3){x.fillStyle=`rgba(0,0,0,${o})`;x.beginPath();x.ellipse(a,b,rx,ry,0,0,Math.PI*2);x.fill()}
function choose(n){const b=B[1+((Math.random()*(B.length-1))|0)];n.tx=b.x+rnd(-28,28);n.ty=b.y+rnd(14,42);n.phase=0;n.carry=false}function add(){const pal=["#b64f43","#4e76a4","#71834f","#8e5b9e","#bd9240","#9d6752","#4b8b87"];let n={x:rnd(-30,30),y:rnd(40,110),tx:0,ty:0,phase:0,v:rnd(20,31),c:pal[(Math.random()*pal.length)|0],bob:rnd(0,6.28),carry:false};choose(n);npcs.push(n)}for(let i=0;i<10;i++)add();
function ground(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#131b22");g.addColorStop(.35,"#1b211f");g.addColorStop(1,"#362818");x.fillStyle=g;x.fillRect(0,0,W,H);let base=H*.21;for(let i=-2;i<9;i++){let a=i*150-((cam.x*.08)%150);poly([[a,base+40],[a+65,base-35-(i%3)*18],[a+150,base+40]],i%2?"#0c1317":"#11191c")}let roads=[[0,30,-230,110],[0,30,232,92],[0,30,205,-135],[0,30,-210,-140],[0,20,0,-205]];x.lineCap="round";roads.forEach(q=>{ln(sx(q[0]),sy(q[1]),sx(q[2]),sy(q[3]),"#7a60382f",52);ln(sx(q[0]),sy(q[1]),sx(q[2]),sy(q[3]),"#d5b27418",3)});for(let i=0;i<60;i++){let wx=(i*137)%900-450,wy=(i*83)%680-300,a=sx(wx),b=sy(wy);if(a>-10&&a<W+10&&b>70&&b<H+10){r(a,b,2+i%4,2,"#8c74463a");if(i%5===0){ln(a,b,a+2,b-5,"#6f8c4c");ln(a+2,b-5,a+4,b,"#6f8c4c")}}}}
function building(b){let a=sx(b.x),d=sy(b.y);sh(a,d+39,b.w*.48,15,.42);r(a-b.w/2,d-b.h/2+26,b.w,b.h-26,b.id==="guild"?"#513729":"#493326");r(a-b.w/2+7,d-b.h/2+34,b.w-14,b.h-41,b.id==="guild"?"#6e4930":"#63422e");poly([[a+b.w/2,d-b.h/2+26],[a+b.w/2+12,d-b.h/2+18],[a+b.w/2+12,d+b.h/2-7],[a+b.w/2,d+b.h/2]],"#2a211a");r(a-b.w/2+10,d-b.h/2+31,7,b.h-38,"#261913");r(a+b.w/2-17,d-b.h/2+31,7,b.h-38,"#261913");let roof=b.id==="guild"?"#5f3130":"#674138";for(let i=0;i<7;i++)r(a-b.w/2-16+i*3,d-b.h/2-2+i*5,b.w+32-i*6,6,i%2?roof:"#4d2e2a");ln(a-b.w/2-13,d-b.h/2+30,a+b.w/2+13,d-b.h/2+30,"#c5935c",2);if(b.id!=="quest")[-.26,.14].forEach(k=>{r(a+b.w*k,d+5,16,16,"#2a1c13");r(a+b.w*k+2,d+7,12,12,"#f2b854");r(a+b.w*k+4,d+9,8,8,"#ffd884")});r(a-11,d+13,22,31,"#1a1410");if(b.id==="guild"){r(a-42,d-12,10,32,"#772f2b");r(a+34,d-12,10,32,"#772f2b")}let z=b.id==="guild"?"∞":b.id==="inn"?"Z":b.id==="quest"?"!":b.id==="forge"?"⚒":b.id==="tower"?"▲":"$";r(a-15,d-b.h/2+29,30,19,"#17120f");tx(z,a,d-b.h/2+43,12,"#ffd98d");tx(b.n,a,d+b.h/2+17,9,"#e4c89a")}
function npc(n){let a=sx(n.x),b=sy(n.y),q=Math.sin(n.bob)*1.3;sh(a,b+12,9,4,.32);r(a-5,b+4-q,3,7,"#24211f");r(a+2,b+4+q,3,7,"#24211f");r(a-7,b-11+q,14,16,n.c);r(a-5,b-9+q,10,3,"#d8c17e");r(a-5,b-18+q,10,8,"#d8b28a");r(a-6,b-20+q,12,4,"#4b3326");ln(a+7,b-10,a+12,b+2,"#c7c4bc",2);if(n.carry)r(a-14,b-8+q,6,6,"#d9a84b")}
function player(){let a=sx(P.x),b=sy(P.y),q=Math.sin(P.walk)*1.8;sh(a,b+15,12,5,.42);r(a-5,b+3-q,4,10,"#332b24");r(a+2,b+3+q,4,10,"#332b24");r(a-8,b-13+q,16,18,"#c8c2b3");r(a-6,b-21+q,12,9,"#d5b38e");r(a-9,b-10+q,18,4,"#55636e");r(a-8,b-6+q,16,10,"#3d4650");poly([[a-15,b-22+q],[a+15,b-22+q],[a+8,b-26+q],[a-8,b-26+q]],"#d7c99d");r(a-8,b-31+q,16,7,"#bfb489");ln(a+(P.dir>0?9:-9),b-10,a+(P.dir>0?15:-15),b+5,"#dad8cf",2);tx("YOU",a,b-37+q,8,"#ffe2a5")}
function fire(){let a=sx(0),b=sy(82);sh(a,b+11,22,7,.48);r(a-18,b+8,36,5,"#5a3920");let q=T*.012;x.fillStyle="#ff7432";x.beginPath();x.moveTo(a-12,b+7);x.quadraticCurveTo(a-17,b-11,a+Math.sin(q)*4,b-27);x.quadraticCurveTo(a+19,b-8,a+10,b+8);x.fill();x.fillStyle="#ffd368";x.beginPath();x.moveTo(a-6,b+7);x.quadraticCurveTo(a-5,b-6,a+1,b-16);x.quadraticCurveTo(a+9,b-3,a+5,b+7);x.fill();if(Math.random()<.28)parts.push({x:rnd(-6,6),y:70,vx:rnd(-4,4),vy:rnd(-25,-12),life:rnd(.5,1),c:"#ffbf61",s:rnd(1,3)})}
function atmosphere(){x.globalAlpha=.09;for(let i=0;i<4;i++){let y=H*.25+i*100+Math.sin(T*.00035+i)*22,g=x.createLinearGradient(0,y-35,0,y+35);g.addColorStop(0,"transparent");g.addColorStop(.5,"#c8d3ce");g.addColorStop(1,"transparent");x.fillStyle=g;x.fillRect(0,y-38,W,76)}x.globalAlpha=1;let a=sx(0),b=sy(80),g=x.createRadialGradient(a,b,10,a,b,170);g.addColorStop(0,"rgba(255,185,87,.26)");g.addColorStop(.5,"rgba(255,109,39,.07)");g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(a-180,b-180,360,360);let v=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);v.addColorStop(0,"transparent");v.addColorStop(1,"rgba(0,0,0,.55)");x.fillStyle=v;x.fillRect(0,0,W,H)}
function update(dt){T+=dt*1000;let m=spd*(fever>0?2.6:1),d=dt*m;if(fever>0)fever-=dt;P.x+=P.vx*d;P.y+=P.vy*d;P.x=cl(P.x,-420,420);P.y=cl(P.y,-310,330);if(Math.abs(P.vx)+Math.abs(P.vy)>1)P.walk+=dt*14*spd;cam.x+=(P.x-cam.x)*Math.min(1,dt*3.2);cam.y+=(P.y-55-cam.y)*Math.min(1,dt*3.2);S.gold+=d*(.42+S.lv*.17+npcs.length*.035);S.wood+=d*(.024+S.lv*.004);S.food+=d*(.032+S.lv*.005);npcs.forEach(n=>{n.bob+=dt*7*spd;let dx=n.tx-n.x,dy=n.ty-n.y,l=Math.hypot(dx,dy)||1,v=n.v*d;n.x+=dx/l*v;n.y+=dy/l*v;if(l<7){if(n.phase===0){n.phase=1;n.carry=true;n.tx=rnd(-42,42);n.ty=rnd(12,58)}else{n.phase=0;n.carry=false;let q=(9+S.lv*3)*(fever>0?2:1);S.gold+=q;S.wood+=rnd(.2,.8);S.food+=rnd(.1,.5);floats.push({x:n.x,y:n.y,s:"+"+Math.floor(q)+"G",life:1.2});if(Math.random()<.12)msg("Quest complete  •  +"+Math.floor(q)+" Gold");coin();choose(n)}}})}
function render(dt){x.save();if(shake>0){x.translate(rnd(-shake,shake),rnd(-shake,shake));shake*=.9}ground();[...B].sort((a,b)=>a.y-b.y).forEach(building);npcs.slice().sort((a,b)=>a.y-b.y).forEach(npc);player();fire();for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}x.globalAlpha=cl(p.life,0,1);r(sx(p.x),sy(p.y),p.s,p.s,p.c);x.globalAlpha=1}for(let i=floats.length-1;i>=0;i--){let f=floats[i];f.y-=18*dt;f.life-=dt;if(f.life<=0){floats.splice(i,1);continue}x.globalAlpha=cl(f.life,0,1);tx(f.s,sx(f.x),sy(f.y),10,"#ffe08e");x.globalAlpha=1}atmosphere();x.restore();$("gold").textContent=fmt(S.gold);$("wood").textContent=fmt(S.wood);$("food").textContent=fmt(S.food);$("level").textContent="Lv."+S.lv;$("cost").textContent=fmt(Math.floor(120*Math.pow(1.72,S.lv-1)))+"G"}
function loop(now){let dt=Math.min(.034,(now-last)/1000);last=now;update(dt);render(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
let jid=null,jx=0,jy=0;function js(e){if(e.target.closest("button"))return;jid=e.pointerId;jx=e.clientX;jy=e.clientY;$("joy").style.display="block";$("joy").style.left=jx-56+"px";$("joy").style.top=jy-56+"px";jm(e);try{c.setPointerCapture(e.pointerId)}catch(_){}}function jm(e){if(e.pointerId!==jid)return;let dx=e.clientX-jx,dy=e.clientY-jy,l=Math.hypot(dx,dy),m=48;if(l>m){dx=dx/l*m;dy=dy/l*m}$("nub").style.transform=`translate(${dx}px,${dy}px)`;P.vx=dx/m*84;P.vy=dy/m*84;if(Math.abs(dx)>2)P.dir=dx>0?1:-1}function je(e){if(e.pointerId!==jid)return;jid=null;P.vx=P.vy=0;$("joy").style.display="none";$("nub").style.transform=""}c.addEventListener("pointerdown",js);c.addEventListener("pointermove",jm);c.addEventListener("pointerup",je);c.addEventListener("pointercancel",je);
function ai(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination)}function tone(f,d,type="sine",v=.08,delay=0){if(!ac||muted)return;let o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(master);o.start(s);o.stop(s+d+.03)}function music(){if(bgm)return;let M=[261.63,293.66,329.63,392,440,392,329.63,293.66],B=[130.81,130.81,110,110,146.83,146.83,98,98],i=0;bgm=setInterval(()=>{if(!muted){tone(M[i%8],.62,i%2?"triangle":"sine",.035);if(i%2===0)tone(B[i%8],1.05,"sine",.035);if(i%4===0)tone(M[(i+2)%8]*2,.2,"triangle",.018,.16)}i++},470)}function coin(){if(ac&&!muted&&Math.random()<.15){tone(900,.07,"square",.018);tone(1350,.1,"square",.012,.06)}}function ups(){tone(392,.1,"triangle",.06);tone(523.25,.13,"triangle",.06,.09);tone(659.25,.22,"triangle",.06,.2)}
$("sound").onclick=async()=>{ai();if(ac.state==="suspended")await ac.resume();if(!bgm){muted=false;music()}else muted=!muted;$("sound").textContent=muted?"×":"♪";msg(muted?"BGM OFF":"BGM ON")};$("speed").onclick=()=>{let a=[1,2,5,10],i=a.indexOf(spd);spd=a[(i+1)%a.length];$("speed").textContent="×"+spd;msg("World speed ×"+spd)};$("hire").onclick=()=>{if(S.gold<60){msg("Gold不足  •  60G 必要");return}S.gold-=60;add();tone(330,.08,"square",.04);tone(494,.13,"triangle",.05,.08);msg("New adventurer joined  •  "+npcs.length+" total")};$("upgrade").onclick=()=>{let cost=Math.floor(120*Math.pow(1.72,S.lv-1));if(S.gold<cost){msg("Gold不足  •  "+fmt(cost)+"G 必要");return}S.gold-=cost;S.lv++;shake=7;let q=S.lv<5?2:3;for(let i=0;i<q;i++)add();for(let i=0;i<35;i++)parts.push({x:rnd(-70,70),y:rnd(-50,50),vx:rnd(-65,65),vy:rnd(-85,-20),life:rnd(.5,1.2),c:Math.random()<.5?"#ffd36d":"#ff884d",s:rnd(2,5)});ups();msg("GUILD LEVEL "+S.lv+"  •  Adventurers +"+q)};$("fever").onclick=()=>{fever=20;shake=3;for(let i=0;i<45;i++)parts.push({x:rnd(-300,300),y:rnd(-220,260),vx:rnd(-15,15),vy:rnd(-40,-8),life:rnd(.8,1.8),c:"#ffd56d",s:rnd(1,4)});tone(220,.16,"sawtooth",.035);tone(440,.2,"triangle",.05,.12);tone(880,.32,"triangle",.045,.25);msg("FEVER  •  Production ×2.6  •  20 sec")};setTimeout(()=>{$("hint").style.opacity=.3},5000)
})();
