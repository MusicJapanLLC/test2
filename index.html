<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152528"><title>GUILD∞ — 灯の街</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="c" aria-label="ギルドの街"></canvas>
<header id="hud"><div class="identity"><span class="crest">∞</span><span>GUILD<span class="infinity">∞</span><small>灯の街 · LANTERN HOLLOW</small></span><b id="level">Lv.1</b></div><div class="resources"><div><small>GOLD</small><b id="gold">100</b></div><div><small>WOOD</small><b id="wood">30</b></div><div><small>FOOD</small><b id="food">18</b></div></div></header>
<div id="right"><button id="sound" class="utility" aria-label="BGMを切り替える" aria-pressed="false">♪ OFF</button><button id="speed" class="utility" aria-label="世界の進行速度を変更">×1</button></div><div id="log" aria-live="polite"></div>
<aside id="bottom"><button id="upgrade" class="management"><span>GUILD UP</span><small id="cost">120G</small></button><button id="hire" class="management"><span>HIRE</span><small id="roster">10 / 10</small></button><button id="fever" class="management"><span>FEVER</span><small id="fever-time">20 sec</small></button></aside>
<div id="hint">行きたい場所をタップ · 建物をタップで調べる</div>
<nav id="controller" aria-label="ゲームコントローラー"><div class="actions"><button id="action-X" data-action="X" class="x" aria-label="X 台帳">X<small>台帳</small></button><button id="action-Y" data-action="Y" class="y" aria-label="Y 状況">Y<small>状況</small></button><button id="action-A" data-action="A" class="a" aria-label="A 調べる">A<small>調べる</small></button><button id="action-B" data-action="B" class="b" aria-label="B 移動を止める">B<small>止める</small></button></div></nav>
<section id="menu" hidden role="dialog" aria-modal="true" aria-labelledby="menu-title"><div class="ledger"><small>GUILD ARCHIVES</small><h1 id="menu-title">ギルド台帳</h1><p id="menu-status"></p><div class="rule"></div><p>冒険者たちは依頼を受け、街に資源を持ち帰る<br>設備を育てて、この小さな街の灯を増やそう</p><dl><dt>歩く</dt><dd>画面タップ / WASD / 矢印</dd><dt>調べる</dt><dd>A / Space / Enter</dd><dt>台帳</dt><dd>X</dd><dt>戻る</dt><dd>B / Escape</dd></dl><p class="save-note">15秒ごとに自動記録 · このブラウザに保存</p><button id="menu-save" class="ledger-button">今の街を記録する</button><button id="menu-close" class="ledger-button secondary">街へ戻る　B</button></div></section>
<script src="graphics.js"></script><script src="audio.js"></script><script src="game.js"></script></body></html>
