.card .cost{color:#d9b56d}.card button{margin-top:auto;border:1px solid #8ea997;background:#243b37;color:#fff;padding:7px 4px;border-radius:3px;font:900 9px inherit}.card button:disabled{opacity:.28}.card.ready{border-color:#d1aa5e;box-shadow:0 0 0 1px rgba(209,170,94,.2),0 0 14px rgba(209,170,94,.15)}#toast{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%) scale(.94);z-index:10;opacity:0;pointer-events:none;background:rgba(13,22,21,.92);border:1px solid #c9a65d;padding:8px 12px;border-radius:4px;text-align:center;transition:.18s}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#toast b{display:block;color:#f4d38a;font-size:12px}#toast small{font-size:9px;color:#c9d5ce}

(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),$=s=>document.querySelector(s);let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2),last=performance.now(),simTime=0,productionClock=0;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();const KEY='guild-v091-casual-builder',rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));const P={x:0,y:80,vx:0,vy:0,dir:'down',walk:0,swing:0,target:null};const cam={x:0,y:45},parts=[],pops=[];const S={day:1,phase:'day',phaseT:0,wood:0,stone:0,food:0,builds:[],savedAt:0};const phases=[['day',180],['dusk',15],['night',40],['dawn',10]];const specs={hut:{name:'小屋',cost:{wood:8,stone:3},desc:'人口と街並みの土台'},lumber:{name:'木材所',cost:{wood:10,stone:2},desc:'WOOD収集の拠点'},quarry:{name:'採石所',cost:{wood:6,stone:8},desc:'STONE収集の拠点'},barricade:{name:'防壁',cost:{wood:8,stone:6},desc:'夜の保険'},garden:{name:'畑',cost:{wood:7,stone:2},desc:'FOODの拠点'},workshop:{name:'工房',cost:{wood:14,stone:10},desc:'後半クラフト。必須ゲートではない'}};const trees=[],rocks=[],bushes=[];function scatter(arr,count,kind,min=70,max=390){for(let i=0;i<count;i++){let a=(i/count)*Math.PI*2+r=rnd(-.2,.2),r=rnd(min,max),x=Math.cos(a)*r+rnd(-38,38),y=Math.sin(a)*r*.72+rnd(-34,34)+30;arr.push({id:kind+i,kind,x,y,hp:kind==='tree'?3:kind==='rock'?4:1,max:kind==='tree'?3:kind==='rock'?4:1,resp:0,hit:0})}};
