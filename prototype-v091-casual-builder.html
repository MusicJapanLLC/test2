<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GUILD∞ v0.9.1 Casual Builder</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#f5eddc;background:#0e1718}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1718}body{touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:fixed;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));z-index:5;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand,.phase,.resbar,#objective,#save,#hint,.buildbar{background:linear-gradient(180deg,rgba(20,34,34,.96),rgba(12,23,24,.94));border:1px solid #5e776e;box-shadow:0 4px 0 rgba(0,0,0,.28);border-radius:5px}.brand{padding:8px 10px;font-weight:900;letter-spacing:.06em}.brand small{display:block;color:#9db4aa;font-size:9px;margin-top:2px}.phase{padding:7px 10px;text-align:right}.phase b{display:block;color:#e0b76a;font-size:12px}.phase small{font-size:9px;color:#c7d2cb}.resbar{display:grid;grid-template-columns:repeat(4,1fr);margin-top:7px;overflow:hidden}.res{padding:6px 7px;border-right:1px solid rgba(117,145,133,.28)}.res:last-child{border:0}.res small{display:block;color:#90a79d;font-size:8px}.res b{font-size:15px}#objective{margin-top:7px;padding:7px 9px;font-size:10px;color:#f1d59f}
#save{position:fixed;right:12px;top:112px;z-index:6;padding:5px 7px;font-size:9px;opacity:.4;transition:.18s;pointer-events:none}#save.on{opacity:1;border-color:#9fcf9c}#sound{position:fixed;right:12px;top:145px;z-index:8;border:1px solid #6b8178;background:#172827;color:#eadfc7;padding:7px 9px;border-radius:4px;font:700 9px inherit}#hint{position:fixed;left:12px;bottom:164px;z-index:5;padding:6px 8px;font-size:9px;opacity:.88;pointer-events:none}#target{position:fixed;left:50%;transform:translateX(-50%);bottom:157px;z-index:5;background:rgba(13,25,25,.9);border:1px solid #78978b;padding:6px 10px;border-radius:4px;font-weight:900;font-size:10px;pointer-events:none}
.buildbar{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));height:138px;z-index:7;padding:7px;overflow-x:auto;overflow-y:hidden;display:flex;gap:7px;align-items:stretch}.card{min-width:118px;max-width:118px;border:1px solid #4f675e;background:#162625;color:#eadfc7;border-radius:4px;padding:7px;display:flex;flex-direction:column;gap:4px}.card strong{font-size:11px}.card small{font-size:8px;color:#91a89e;line-height:1.35}.card .cost{color:#d9b56d}.card button{margin-top:auto;border:1px solid #8ea997;background:#243b37;color:#fff;padding:7px 4px;border-radius:3px;font:900 9px inherit}.card button:disabled{opacity:.28}.card.ready{border-color:#d1aa5e;box-shadow:0 0 0 1px rgba(209,170,94,.2),0 0 14px rgba(209,170,94,.15)}
#toast{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%) scale(.94);z-index:10;opacity:0;pointer-events:none;background:rgba(13,22,21,.92);border:1px solid #c9a65d;padding:8px 12px;border-radius:4px;text-align:center;transition:.18s}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#toast b{display:block;color:#f4d38a;font-size:12px}#toast small{font-size:9px;color:#c9d5ce}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="top"><div class="brand">GUILD∞<small>CASUAL BUILDER v0.9.1</small></div><div class="phase"><b id="phase">DAY 1</b><small id="clock">02:59</small></div></div><div class="resbar"><div class="res"><small>WOOD</small><b id="wood">0</b></div><div class="res"><small>STONE</small><b id="stone">0</b></div><div class="res"><small>FOOD</small><b id="food">0</b></div><div class="res"><small>BUILDINGS</small><b id="built">0</b></div></div><div id="objective">近くの木・石は自動採取 → 資源が貯まったらすぐ建設</div></div>
<div id="save">SAVE ✓</div><button id="sound">♪ MUSIC</button><div id="hint">押したまま滑らせる＝滑らか移動 / 離す＝停止 / 近くの木・石は自動採取</div><div id="target">AUTO GATHER · SEARCHING</div><div class="buildbar" id="buildbar"></div><div id="toast"><b id="toastTitle">BUILD!</b><small id="toastText">完成</small></div>
<script>
(()=>{'use strict';
const c=document.getElementById('c'),ctx=c.getContext('2d'),$=s=>document.querySelector(s);let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2),last=performance.now(),simTime=0,productionClock=0;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const KEY='guild-v091-casual-builder',rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));const P={x:0,y:80,vx:0,vy:0,dir:'down',walk:0,swing:0,target:null},cam={x:0,y:45},parts=[],pops=[];const S={day:1,phase:'day',phaseT:0,wood:0,stone:0,food:0,builds:[],savedAt:0};const phases=[['day',180],['dusk',15],['night',40],['dawn',10]];const specs={hut:{name:'小屋',cost:{wood:8,stone:3},desc:'人口と街並みの土台'},lumber:{name:'木材所',cost:{wood:10,stone:2},desc:'WOOD収集の拠点'},quarry:{name:'採石所',cost:{wood:6,stone:8},desc:'STONE収集の拠点'},barricade:{name:'防壁',cost:{wood:8,stone:6},desc:'夜の保険'},garden:{name:'畑',cost:{wood:7,stone:2},desc:'FOODの拠点'},workshop:{name:'工房',cost:{wood:14,stone:10},desc:'後半クラフト。必須ゲートではない'}};
const trees=[],rocks=[],bushes=[];function scatter(arr,count,kind,min=70,max=390){for(let i=0;i<count;i++){const a=(i/count)*Math.PI*2+rnd(-.2,.2),r=rnd(min,max),x=Math.cos(a)*r+rnd(-38,38),y=Math.sin(a)*r*.72+rnd(-34,34)+30;arr.push({id:kind+i,kind,x,y,hp:kind==='tree'?3:kind==='rock'?4:1,max:kind==='tree'?3:kind==='rock'?4:1,resp:0,hit:0})}}scatter(trees,52,'tree',60,410);scatter(rocks,32,'rock',75,390);scatter(bushes,14,'bush',65,330);const spots=[[-70,20],[70,14],[-118,86],[118,88],[-15,-66],[145,-35],[-150,-42],[20,130],[170,126],[-178,135],[0,-145],[210,20],[-215,25],[92,-128],[-94,-126]];
const sx=x=>W/2+x-cam.x,sy=y=>H/2+y-cam.y-52;function phaseInfo(){return phases.find(p=>p[0]===S.phase)}function nextPhase(){let i=phases.findIndex(p=>p[0]===S.phase);i=(i+1)%phases.length;S.phase=phases[i][0];S.phaseT=0;if(S.phase==='day')S.day++;save('phase')}
function save(reason){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify({S,P:{x:P.x,y:P.y,dir:P.dir},trees:trees.map(n=>[n.hp,n.resp]),rocks:rocks.map(n=>[n.hp,n.resp]),bushes:bushes.map(n=>[n.hp,n.resp])}))}catch(_){}const el=$('#save');el.classList.add('on');clearTimeout(save.t);save.t=setTimeout(()=>el.classList.remove('on'),350)}function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;Object.assign(S,d.S||{});if(d.P)Object.assign(P,d.P);[trees,rocks,bushes].forEach((arr,ai)=>{const list=[d.trees,d.rocks,d.bushes][ai]||[];list.forEach((v,i)=>{if(arr[i]){arr[i].hp=v[0];arr[i].resp=v[1]}})})}catch(_){}}
let audio=null,master=null,musicOn=true,nextBeat=0,beat=0;function audioStart(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.22;master.connect(audio.destination);nextBeat=audio.currentTime+.04}function ping(freq=440,dur=.07,type='square',gain=.05,delay=0){if(!audio||!musicOn)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+delay+dur);o.connect(g);g.connect(master);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+dur+.02)}function sfx(kind){if(kind==='wood'){ping(180,.045,'square',.045);ping(120,.06,'triangle',.035,.035)}if(kind==='stone'){ping(620,.025,'square',.035);ping(380,.045,'triangle',.03,.025)}if(kind==='build'){ping(392,.08,'triangle',.05);ping(523,.10,'triangle',.05,.07);ping(659,.14,'triangle',.045,.14)}}function musicTick(){if(!audio||!musicOn)return;while(nextBeat<audio.currentTime+.12){const scale=S.phase==='night'?[110,131,147,165]:[147,165,196,220,247],f=scale[beat%scale.length];ping(f,.22,'triangle',.018,nextBeat-audio.currentTime);if(beat%4===0)ping(f/2,.30,'sine',.014,nextBeat-audio.currentTime);nextBeat+=.42;beat++}}$('#sound').onclick=()=>{audioStart();musicOn=!musicOn;$('#sound').textContent=musicOn?'♪ MUSIC':'♪ MUTED'};
function pop(x,y,text,col='#f5d58c'){pops.push({x,y,text,col,life:1})}function burst(x,y,col,count=8){for(let i=0;i<count;i++)parts.push({x,y,vx:rnd(-35,35),vy:rnd(-55,-10),life:rnd(.35,.7),col,s:rnd(2,4)})}
function drawTree(n){if(n.hp<=0)return;const X=sx(n.x),Y=sy(n.y);ctx.fillStyle='#182a24';ctx.fillRect(X-13,Y+13,27,5);ctx.fillStyle='#735238';ctx.fillRect(X-4,Y-2,8,20);ctx.fillStyle=n.hit>0?'#8fb08d':'#365a4c';ctx.fillRect(X-17,Y-22,35,18);ctx.fillStyle='#496d58';ctx.fillRect(X-12,Y-32,25,15)}function drawRock(n){if(n.hp<=0)return;const X=sx(n.x),Y=sy(n.y);ctx.fillStyle='#1c2828';ctx.fillRect(X-14,Y+8,29,5);ctx.fillStyle=n.hit>0?'#c8d0c8':'#667774';ctx.fillRect(X-12,Y-8,24,17);ctx.fillStyle='#84918c';ctx.fillRect(X-6,Y-14,13,8);ctx.fillStyle='#485654';ctx.fillRect(X+5,Y-4,8,10)}function drawBush(n){if(n.hp<=0)return;const X=sx(n.x),Y=sy(n.y);ctx.fillStyle='#274238';ctx.fillRect(X-9,Y-4,19,12);ctx.fillStyle='#a44d5f';ctx.fillRect(X-5,Y,3,3);ctx.fillRect(X+4,Y-2,3,3)}
function drawBuilding(b){const X=sx(b.x),Y=sy(b.y),t=b.type;ctx.fillStyle='#1b2928';ctx.fillRect(X-26,Y+18,54,6);if(t==='hut'){ctx.fillStyle='#7b5d3c';ctx.fillRect(X-22,Y-5,44,26);ctx.fillStyle='#b08352';ctx.beginPath();ctx.moveTo(X-28,Y-5);ctx.lineTo(X,Y-27);ctx.lineTo(X+28,Y-5);ctx.fill()}else if(t==='lumber'){ctx.fillStyle='#6d4c32';ctx.fillRect(X-25,Y-4,50,24);ctx.fillStyle='#bd8d58';for(let k=0;k<5;k++)ctx.fillRect(X-21+k*9,Y+3,7,4)}else if(t==='quarry'){ctx.fillStyle='#606f6d';ctx.fillRect(X-24,Y,48,20);ctx.fillStyle='#84938e';ctx.fillRect(X-16,Y-10,31,12)}else if(t==='barricade'){ctx.fillStyle='#6b4a30';for(let k=-22;k<=22;k+=11)ctx.fillRect(X+k,Y-11,7,32);ctx.fillRect(X-28,Y+7,58,6)}else if(t==='garden'){ctx.fillStyle='#5f7145';ctx.fillRect(X-25,Y+2,50,18);ctx.fillStyle='#9b7442';for(let k=-20;k<=20;k+=10)ctx.fillRect(X+k,Y+5,5,13)}else{ctx.fillStyle='#71533b';ctx.fillRect(X-24,Y-6,48,28);ctx.fillStyle='#9c7b54';ctx.fillRect(X-12,Y-16,24,12)}}
function drawPlayer(){const X=sx(P.x),Y=sy(P.y);ctx.fillStyle='#192724';ctx.fillRect(X-10,Y+15,22,5);ctx.fillStyle='#6f8fa0';ctx.fillRect(X-8,Y-9,16,21);ctx.fillStyle='#d4b17f';ctx.fillRect(X-6,Y-19,12,10);ctx.fillStyle='#304853';ctx.fillRect(X-7,Y+11,5,11);ctx.fillRect(X+3,Y+11,5,11);if(P.swing>0){const a=(1-P.swing/.34)*1.8-.8,tx=X+Math.cos(a)*18,ty=Y-3+Math.sin(a)*18;ctx.strokeStyle=P.target?.kind==='rock'?'#b7c1bc':'#d9b36e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X+4,Y-5);ctx.lineTo(tx,ty);ctx.stroke();ctx.fillStyle='#d0d7d2';ctx.fillRect(tx-3,ty-2,7,4)}}
function draw(){const night=S.phase==='night',dusk=S.phase==='dusk';ctx.fillStyle=night?'#152329':'#29453d';ctx.fillRect(0,0,W,H);for(let gx=-520;gx<520;gx+=26)for(let gy=-400;gy<500;gy+=26){ctx.fillStyle=((gx+gy)/26)%2?'#2e4c42':'#29463e';ctx.fillRect(sx(gx),sy(gy),25,25)}trees.forEach(drawTree);rocks.forEach(drawRock);bushes.forEach(drawBush);S.builds.forEach(drawBuilding);for(let i=0;i<S.builds.length;i++){const b=S.builds[i];if(!['lumber','quarry','garden'].includes(b.type))continue;const X=sx(b.x),Y=sy(b.y),a=simTime*1.8+i,ox=Math.cos(a)*20,oy=Math.sin(a*.8)*9;ctx.fillStyle='#182724';ctx.fillRect(X+ox-5,Y+oy+7,11,3);ctx.fillStyle=b.type==='quarry'?'#87918b':'#8b7652';ctx.fillRect(X+ox-4,Y+oy-7,8,14);ctx.fillStyle='#d0ae7b';ctx.fillRect(X+ox-3,Y+oy-13,6,6);if(Math.sin(a*2)>0){ctx.strokeStyle=b.type==='quarry'?'#c7d1cc':'#d8ad69';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X+ox+3,Y+oy-4);ctx.lineTo(X+ox+10,Y+oy-11);ctx.stroke()}}drawPlayer();for(const p of parts){ctx.globalAlpha=cl(p.life*2,0,1);ctx.fillStyle=p.col;ctx.fillRect(sx(p.x),sy(p.y),p.s,p.s)}ctx.globalAlpha=1;ctx.font='bold 11px ui-monospace,monospace';ctx.textAlign='center';for(const p of pops){ctx.globalAlpha=cl(p.life*1.5,0,1);ctx.fillStyle=p.col;ctx.fillText(p.text,sx(p.x),sy(p.y)-20)}ctx.globalAlpha=1;ctx.textAlign='start';if(dusk){ctx.fillStyle='rgba(176,100,56,.13)';ctx.fillRect(0,0,W,H)}if(night){ctx.fillStyle='rgba(5,14,28,.42)';ctx.fillRect(0,0,W,H)}}
function nearest(){let best=null,bd=67;for(const n of [...trees,...rocks,...bushes]){if(n.hp<=0)continue;const d=Math.hypot(P.x-n.x,P.y-n.y);if(d<bd){bd=d;best=n}}return best}let autoCd=0,inputting=false;function hitTarget(n){if(!n)return;P.target=n;P.swing=.34;n.hit=.12;n.hp--;if(n.kind==='tree'){S.wood++;pop(n.x,n.y,'+1 WOOD');burst(n.x,n.y,'#c3975b',6);sfx('wood');if(n.hp<=0){S.wood+=2;pop(n.x,n.y-10,'+2 BONUS','#ffe39b');n.resp=9}}else if(n.kind==='rock'){S.stone++;pop(n.x,n.y,'+1 STONE','#dbe3de');burst(n.x,n.y,'#9caaa4',7);sfx('stone');if(n.hp<=0){S.stone+=2;pop(n.x,n.y-10,'+2 BONUS','#eef5f1');n.resp=11}}else{S.food+=2;pop(n.x,n.y,'+2 FOOD','#e88b93');burst(n.x,n.y,'#b75c68',5);n.resp=12}save('gather')}
function canBuild(type,cost=specs[type].cost){return S.wood>=cost.wood&&S.stone>=cost.stone}function toast(a,b){$('#toastTitle').textContent=a;$('#toastText').textContent=b;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),900)}function build(type,costOverride=null){const base=specs[type],count=S.builds.filter(b=>b.type===type).length,m=1+count*.18,cost=costOverride||{wood:Math.ceil(base.cost.wood*m),stone:Math.ceil(base.cost.stone*m)};if(!canBuild(type,cost))return false;S.wood-=cost.wood;S.stone-=cost.stone;const i=S.builds.length,spot=spots[i%spots.length],ring=Math.floor(i/spots.length),b={type,x:spot[0]+ring*18,y:spot[1]+ring*14};S.builds.push(b);burst(b.x,b.y,'#f0c36d',24);burst(b.x,b.y,'#dfe9df',10);pop(b.x,b.y-20,'BUILD! '+base.name,'#ffd77e');sfx('build');toast('BUILD COMPLETE',base.name+' · 街が広がった');save('build');renderBuildbar();return true}
function update(dt){simTime+=dt;productionClock+=dt;S.phaseT+=dt;const pi=phaseInfo();if(S.phaseT>=pi[1])nextPhase();P.swing=Math.max(0,P.swing-dt);autoCd-=dt;P.x+=P.vx*dt;P.y+=P.vy*dt;P.x=cl(P.x,-430,430);P.y=cl(P.y,-320,360);if(Math.abs(P.vx)+Math.abs(P.vy)>2)P.walk+=dt*10;cam.x+=(P.x-cam.x)*Math.min(1,dt*6.5);cam.y+=(P.y-25-cam.y)*Math.min(1,dt*6.5);for(const n of [...trees,...rocks,...bushes]){n.hit=Math.max(0,n.hit-dt);if(n.hp<=0){n.resp-=dt;if(n.resp<=0){n.hp=n.max;n.resp=0}}}if(!inputting&&Math.hypot(P.vx,P.vy)<1&&autoCd<=0){const n=nearest();if(n){hitTarget(n);autoCd=n.kind==='rock'?.5:.43}else P.target=null}for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=65*dt;p.life-=dt}for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);for(const p of pops){p.y-=18*dt;p.life-=dt}for(let i=pops.length-1;i>=0;i--)if(pops[i].life<=0)pops.splice(i,1);if(productionClock>=2){productionClock=0;const lw=S.builds.filter(b=>b.type==='lumber'),qr=S.builds.filter(b=>b.type==='quarry'),gd=S.builds.filter(b=>b.type==='garden');if(lw.length){S.wood+=lw.length;const b=lw[lw.length-1];pop(b.x,b.y,'+'+lw.length+' WOOD','#e6c37f')}if(qr.length){S.stone+=qr.length;const b=qr[qr.length-1];pop(b.x,b.y,'+'+qr.length+' STONE','#d9e1dd')}if(gd.length){S.food+=gd.length;const b=gd[gd.length-1];pop(b.x,b.y,'+'+gd.length+' FOOD','#e8999e')}if(lw.length||qr.length||gd.length)save('production')}musicTick();updateHUD()}
function renderBuildbar(){const bar=$('#buildbar');bar.innerHTML='';for(const[type,s]of Object.entries(specs)){const count=S.builds.filter(b=>b.type===type).length,m=1+count*.18,cost={wood:Math.ceil(s.cost.wood*m),stone:Math.ceil(s.cost.stone*m)},ready=canBuild(type,cost);const card=document.createElement('div');card.className='card'+(ready?' ready':'');card.innerHTML=`<strong>${s.name} <small>×${count}</small></strong><small>${s.desc}</small><small class="cost">WOOD ${cost.wood} · STONE ${cost.stone}</small><button ${ready?'':'disabled'}>建設</button>`;card.querySelector('button').onclick=()=>build(type,cost);bar.appendChild(card)}}
function updateHUD(){$('#wood').textContent=Math.floor(S.wood);$('#stone').textContent=Math.floor(S.stone);$('#food').textContent=Math.floor(S.food);$('#built').textContent=S.builds.length;$('#phase').textContent=`${S.phase.toUpperCase()} ${S.day}`;const r=Math.max(0,phaseInfo()[1]-S.phaseT),m=Math.floor(r/60),s=Math.floor(r%60);$('#clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;const n=nearest();$('#target').textContent=inputting?'MOVE · FREE ANALOG':n?`AUTO ${n.kind==='tree'?'CHOP':n.kind==='rock'?'MINE':'GATHER'} · ${Math.ceil(Math.hypot(P.x-n.x,P.y-n.y))}px`:'AUTO GATHER · MOVE NEAR RESOURCE';if(Math.random()<.08)renderBuildbar()}
let pointer=null;c.addEventListener('pointerdown',e=>{e.preventDefault();audioStart();if(audio.state==='suspended')audio.resume();inputting=true;pointer={id:e.pointerId,x:e.clientX,y:e.clientY};c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;e.preventDefault();const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y,d=Math.hypot(dx,dy),dead=4,k=d<dead?0:cl((d-dead)/56,0,1),nx=d?dx/d:0,ny=d?dy/d:0,speed=158;P.vx=nx*speed*k;P.vy=ny*speed*k;if(Math.abs(P.vx)>Math.abs(P.vy))P.dir=P.vx>0?'right':'left';else if(k)P.dir=P.vy>0?'down':'up'});function release(e){if(!pointer||e.pointerId!==pointer.id)return;P.vx=P.vy=0;pointer=null;inputting=false}c.addEventListener('pointerup',release);c.addEventListener('pointercancel',release);c.addEventListener('lostpointercapture',()=>{P.vx=P.vy=0;pointer=null;inputting=false});
window.GUILD_V091_API=Object.freeze({getState:()=>JSON.parse(JSON.stringify(S)),getPlayer:()=>JSON.parse(JSON.stringify(P)),getNodes:()=>({trees:JSON.parse(JSON.stringify(trees)),rocks:JSON.parse(JSON.stringify(rocks)),bushes:JSON.parse(JSON.stringify(bushes))}),grant:(wood=0,stone=0,food=0)=>{S.wood+=wood;S.stone+=stone;S.food+=food;renderBuildbar();updateHUD()},build,save});load();renderBuildbar();updateHUD();setInterval(()=>save('auto'),2000);function loop(now){const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
