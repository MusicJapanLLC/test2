<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#142425"><title>GUILD∞ v0.8 Bottom Bar</title><link rel="stylesheet" href="ui-v08.css"></head>
<body><canvas id="c" aria-label="ギルドの街"></canvas>
<header id="hud"><div class="identity"><span class="crest">∞</span><span class="brand">GUILD<span>∞</span><small>灯の街 · LANTERN HOLLOW</small></span><b id="level">Lv.1</b></div><div class="resources"><div><small>GOLD</small><b id="gold">100</b></div><div><small>WOOD</small><b id="wood">30</b></div><div><small>FOOD</small><b id="food">18</b></div></div></header>

<div class="goal"><b>目標</b> 冒険者を12人にする <span id="goal-progress">6 / 12</span></div>
