<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101a16">
<title>GUILD∞ — Frontier v1.4</title>
<link rel="stylesheet" href="buildjoy-v13.css">
<link rel="stylesheet" href="buildjoy-v14.css">
</head>
<body>
<canvas id="game" aria-label="GUILD∞ Frontier"></canvas>
<header id="topbar">
  <div id="day-chip"><b id="day">DAY 1</b><span id="phase">DAY</span><small id="clock">08:00</small><i id="save-dot" title="autosave"></i></div>
  <div id="resources">
    <span><i class="r wood"></i><small>WOOD</small><b id="wood">0</b></span>
    <span><i class="r stone"></i><small>STONE</small><b id="stone">0</b></span>
    <span><i class="r food"></i><small>FOOD</small><b id="food">0</b></span>
    <span><i class="r people"></i><small>PEOPLE</small><b id="people">0/0</b></span>
  </div>
  <div id="utility"><button id="sound">♪</button><button id="speed">×1</button></div>
</header>
<div id="ticker"><i></i><span id="ticker-text">城内は建設、資源は城外へ</span></div>
<button id="context" hidden><b id="context-main">ATTACK</b><small id="context-sub">近くの敵</small></button>
<nav id="dock">
  <button data-panel="build" class="active"><span>⌂</span><b>BUILD</b><small>街を広げる</small></button>
  <button data-panel="people"><span>♟</span><b>PEOPLE</b><small id="people-caption">小屋で解禁</small></button>
  <button data-panel="bag"><span>◆</span><b>BAG</b><small>DROP / ITEM</small></button>
</nav>
<section id="sheet" hidden>
  <div class="sheet-head"><b id="sheet-title">BUILD</b><button id="sheet-close">×</button></div>
  <div id="panel-build">
    <div class="build-grid">
      <button data-build="hut"><span class="ico hut">⌂</span><b>小屋</b><small>WOOD 10 · STONE 3<br>城内に建設 · 人口上限UP</small></button>
      <button data-build="lumber"><span class="ico lumber">♠</span><b>木材所</b><small>WOOD 18 · STONE 6<br>木こり効率UP</small></button>
      <button data-build="quarry"><span class="ico quarry">◆</span><b>採石所</b><small>WOOD 16 · STONE 10<br>採石効率UP</small></button>
      <button data-build="lantern"><span class="ico lantern">✦</span><b>灯火塔</b><small>WOOD 6 · STONE 2<br>何本でも建設可</small></button>
      <button data-build="palisade" class="wide"><span class="ico wall">▥</span><b>集落防壁</b><small>WOOD 26 · STONE 5<br>一度で集落を囲う</small></button>
    </div>
    <div class="upgrade-zone">
      <div class="upgrade-label"><small>LEVEL SYSTEM</small><b>建物を育てる</b></div>
      <button id="upgrade-hut" class="upgrade-card"><span>↑</span><b>HOUSE LEVEL UP</b><small id="hut-upgrade-desc">小屋を建てると解禁</small></button>
    </div>
  </div>
  <div id="panel-people" hidden>
    <div id="people-lock" class="notice">小屋を建てると雇用が解禁される</div>
    <div class="hire-grid">
      <button data-hire="wood"><b>＋ 木こり</b><small>FOOD 5 · 城外へ出て自動伐採</small></button>
      <button data-hire="stone"><b>＋ 採石人</b><small>FOOD 5 · 城外へ出て自動採掘</small></button>
      <button data-hire="food"><b>＋ 採集人</b><small>FOOD 4 · 食料を自動採集</small></button>
      <button data-hire="guard"><b>＋ 衛兵</b><small>FOOD 7 · 城壁内から自動防衛</small></button>
    </div>
    <div id="worker-list"></div>
  </div>
  <div id="panel-bag" hidden>
    <div class="bag-grid">
      <span><small>AXE</small><b>1</b></span>
      <span><small>HOURGLASS</small><b id="hourglass">1</b></span>
      <span><small>TICKET</small><b id="ticket">0</b></span>
      <span><small>GEM</small><b id="gem">0</b></span>
    </div>
    <p>砂時計で30秒だけ ×2 → ×3　最大×3</p>
  </div>
</section>
<div id="boot-note">v1.4 · OUTSIDE GATHER / INSIDE BUILD / WALL COLLISION</div>
<script src="buildjoy-v13-audio.js"></script>
<script src="buildjoy-v14.js"></script>
</body>
</html>
