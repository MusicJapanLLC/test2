<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1414">
<title>GUILD∞ — REFORM v1.2</title>
<link rel="stylesheet" href="buildjoy-v12.css">
</head>
<body>
<canvas id="game" aria-label="GUILD∞ REFORM v1.2"></canvas>

<header id="hud">
  <section class="hud-main frame-cut">
    <div class="sigil">∞</div>
    <div class="title"><b>GUILD∞</b><small>LANTERN FRONTIER</small></div>
    <div class="day"><b id="day">DAY 1</b><span id="phase">DAY</span><small id="clock">08:00</small></div>
  </section>
  <section class="resources frame-cut">
    <div class="res wood"><i></i><span><small>WOOD</small><b id="wood">0</b></span></div>
    <div class="res stone"><i></i><span><small>STONE</small><b id="stone">0</b></span></div>
    <div class="res food"><i></i><span><small>FOOD</small><b id="food">0</b></span></div>
    <div class="res people"><i></i><span><small>PEOPLE</small><b id="people">0/200</b></span></div>
  </section>
</header>

<div id="quest" class="frame-cut"><span class="quest-mark">◆</span><div><small>NEXT</small><b id="quest-text">近くの木から始めよう</b></div></div>
<div id="warning" hidden></div>
<div id="ticker" class="frame-cut"><span class="pulse"></span><span id="ticker-text">DRAG TO MOVE · 近づくと自動採取</span></div>

<div id="utilities">
  <button id="sound" class="mini">♪ OFF</button>
  <button id="speed" class="mini">×1</button>
</div>

<button id="context" hidden><b id="context-main">ATTACK</b><small id="context-sub">近くの敵</small></button>

<section id="dock" class="frame-cut">
  <button id="build-open" class="dock active"><span class="ico">⌂</span><b>BUILD</b><small>建設</small></button>
  <button id="people-open" class="dock"><span class="ico">♟</span><b>PEOPLE</b><small id="people-caption">小屋で解禁</small></button>
  <button id="bag-open" class="dock"><span class="ico">◆</span><b>BAG</b><small>DROP</small></button>
  <button id="save-open" class="dock"><span class="ico">▣</span><b>SAVE</b><small id="save-status">AUTO</small></button>
</section>

<section id="sheet" class="frame-cut" hidden>
  <header class="sheet-head"><div><small>GUILD∞ MANAGEMENT</small><b id="sheet-title">BUILD</b></div><button id="sheet-close">×</button></header>

  <div id="build-panel" class="cards">
    <button data-build="hut"><span class="card-icon hut"></span><span><b>小屋</b><small>最初の住人を迎える</small><em>WOOD 10 · STONE 3</em></span></button>
    <button data-build="lumber"><span class="card-icon lumber"></span><span><b>木材所</b><small>木こりの効率UP</small><em>WOOD 16 · STONE 5</em></span></button>
    <button data-build="quarry"><span class="card-icon quarry"></span><span><b>採石所</b><small>採石人の効率UP</small><em>WOOD 12 · STONE 9</em></span></button>
    <button data-build="palisade" class="wide wall"><span class="card-icon palisade"></span><span><b>集落防壁</b><small>一度で外周を囲う · ゲート付き</small><em>WOOD 22 · STONE 4</em></span></button>
    <button data-build="lantern"><span class="card-icon lantern"></span><span><b>灯火塔</b><small>夜を照らす</small><em>WOOD 6 · STONE 2</em></span></button>
  </div>

  <div id="people-panel" hidden>
    <div id="people-lock" class="notice">小屋を建てると雇用が解禁される</div>
    <div id="worker-list"></div>
    <div class="hire-grid">
      <button data-hire="wood"><b>木こり</b><small>FOOD 5 · 木材を自動採取</small></button>
      <button data-hire="stone"><b>採石人</b><small>FOOD 5 · 石材を自動採取</small></button>
      <button data-hire="food"><b>採集人</b><small>FOOD 4 · 食料を自動採取</small></button>
      <button data-hire="guard"><b>衛兵</b><small>FOOD 7 · 夜を守る</small></button>
    </div>
  </div>

  <div id="bag-panel" hidden>
    <div class="bag-grid">
      <div><small>AXE</small><b>1</b><span>STARTER</span></div>
      <div><small>HOURGLASS</small><b id="hourglass">1</b><span>RARE</span></div>
      <div><small>TICKET</small><b id="ticket">0</b><span>RARE</span></div>
      <div><small>GEM</small><b id="gem">0</b><span>SR</span></div>
    </div>
    <div class="notice">砂時計で30秒だけ ×2 → ×3 · 最大×3</div>
  </div>

  <div id="save-panel" hidden>
    <div class="save-card"><small>LAST SAVE</small><b id="last-save">--:--:--</b><span>heartbeat / mutation / backup</span></div>
    <button id="manual-save" class="wide-action">今すぐ保存</button>
  </div>
</section>

<div id="asset-state">SPRITE LOADING</div>

<script src="buildjoy-v12-audio.js"></script>
<script src="buildjoy-v12.js"></script>
</body>
</html>
