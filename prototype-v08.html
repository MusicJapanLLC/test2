<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#152528">
<title>GUILD∞ v0.8 — Bottom First</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui-v08.css">
</head>
<body>
<canvas id="c" aria-label="ギルドの街"></canvas>

<header id="hud">
  <div class="identity">
    <span class="crest">∞</span>
    <span class="brand">GUILD<span class="infinity">∞</span><small>灯の街 · LANTERN HOLLOW</small></span>
    <b id="level">Lv.1</b>
  </div>
  <div class="resources">
    <div><small>GOLD</small><b id="gold">100</b></div>
    <div><small>WOOD</small><b id="wood">30</b></div>
    <div><small>FOOD</small><b id="food">18</b></div>
    <div><small>砂時計</small><b id="boost-items">2</b></div>
  </div>
</header>

<div id="right">
  <button id="sound" class="utility" aria-label="BGMを切り替える" aria-pressed="false">♪ OFF</button>
</div>
<div id="log" aria-live="polite"></div>

<div id="building-context" hidden>
  <div class="building-copy">
    <small id="building-kicker">SELECTED FACILITY</small>
    <strong id="building-name">GUILD HALL</strong>
    <span id="building-effect">Lv.1 · 街全体の効率</span>
  </div>
  <button id="building-upgrade" class="context-upgrade"><span>強化</span><small id="building-cost">80G / 10W</small></button>
  <button id="building-dismiss" class="context-close" aria-label="選択解除">×</button>
</div>

<div id="event-ticker" aria-live="polite">
  <span class="ticker-mark">◆</span>
  <div class="ticker-copy"><small>GUILD LOG</small><strong id="ticker-text">街は静かに動き始めている</strong></div>
  <button id="ticker-open" aria-label="ログを開く">›</button>
</div>

<aside id="quick-actions" aria-label="育成ショートカット">
  <button id="upgrade" class="quick-action"><span>GUILD UP</span><small id="cost">120G</small></button>
  <button id="hire" class="quick-action"><span>HIRE</span><small id="roster">6 / 200</small></button>
  <button id="fever" class="quick-action"><span>FEVER</span><small id="fever-time">20 sec</small></button>
</aside>

<nav id="bottom-dock" aria-label="ゲームメニュー">
  <button class="dock-tab active" data-panel="growth" id="tab-growth"><span class="dock-icon">⬡</span><small>育成</small></button>
  <button class="dock-tab" data-panel="roster" id="tab-roster"><span class="dock-icon">♙</span><small>冒険者</small></button>
  <button id="boost" class="boost-core" aria-label="倍速を使用"><span id="boost-speed">×1</span><small id="boost-label">砂時計 2</small></button>
  <button class="dock-tab" data-panel="facilities" id="tab-facilities"><span class="dock-icon">▣</span><small>施設</small></button>
  <button class="dock-tab" data-panel="logs" id="tab-logs"><span class="dock-icon">≡</span><small>ログ</small></button>
</nav>

<section id="dock-sheet" hidden aria-label="下部メニュー">
  <div class="sheet-grip"></div>
  <header class="sheet-head"><div><small id="sheet-kicker">GUILD MENU</small><h2 id="sheet-title">育成</h2></div><button id="sheet-close" aria-label="閉じる">×</button></header>
  <div id="sheet-body"></div>
</section>

<div id="hint">押したまま指を滑らせる：移動　建物を軽くタップ：施設を選択</div>

<script src="graphics.js"></script>
<script src="audio-v07.js"></script>
<script src="game-v08.js"></script>
</body>
</html>
