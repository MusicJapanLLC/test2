<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#152528">
<title>GUILD∞ — Experience Prototype v0.8</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="prototype-experience-v06.css">
<link rel="stylesheet" href="prototype-experience-v07.css">
<link rel="stylesheet" href="prototype-experience-v08.css">
</head>
<body>
<canvas id="c" aria-label="ギルドの街"></canvas>
<div id="touch-pulse" aria-hidden="true"></div>

<header id="hud">
  <div class="identity">
    <span class="crest">∞</span>
    <span class="guild-word">GUILD<span class="infinity">∞</span><small>灯の街 · LANTERN HOLLOW</small></span>
    <b id="level">Lv.1</b>
  </div>
  <div class="resources" aria-label="資源">
    <div><small>GOLD</small><b id="gold">100</b></div>
    <div><small>WOOD</small><b id="wood">30</b></div>
    <div><small>FOOD</small><b id="food">18</b></div>
  </div>
</header>

<div id="right" aria-label="ユーティリティ">
  <button id="sound" class="utility" aria-label="BGMを切り替える" aria-pressed="false">♪ OFF</button>
  <button id="speed" class="utility speed-locked" aria-label="世界の進行速度">×1</button>
</div>

<!-- Canonical runtime log remains the source; v0.8 mirrors it into the bottom ticker. -->
<div id="log" aria-live="polite"></div>
<div id="hint">DRAG TO WALK　·　指を離すと止まる</div>

<!-- Hidden compatibility actions required by the canonical game core. -->
<nav id="controller" class="compat-controller" aria-hidden="true">
  <div class="actions">
    <button id="action-X" data-action="X" class="x" tabindex="-1">X</button>
    <button id="action-Y" data-action="Y" class="y" tabindex="-1">Y</button>
    <button id="action-A" data-action="A" class="a" tabindex="-1">A</button>
    <button id="action-B" data-action="B" class="b" tabindex="-1">B</button>
  </div>
</nav>

<div id="v08-logbar" role="status" aria-live="polite">
  <span class="log-led"></span>
  <span id="v08-logtext">街は静かに動き続けている</span>
</div>

<section id="v08-dock" aria-label="ギルド管理">
  <div class="v08-quick">
    <button id="upgrade" class="v08-command primary"><span>GUILD UP</span><small id="cost">120G</small></button>
    <button id="hire" class="v08-command"><span>HIRE</span><small id="roster">10 / 200</small></button>
    <button id="fever" class="v08-command"><span>FEVER</span><small id="fever-time">20 sec</small></button>
  </div>

  <nav class="v08-tabs" aria-label="管理タブ">
    <button class="v08-tab is-active" data-v08-tab="guild"><span class="tab-glyph">∞</span><span>ギルド</span></button>
    <button class="v08-tab" data-v08-tab="roster"><span class="tab-glyph">♟</span><span>冒険者</span></button>
    <button class="v08-tab" data-v08-tab="quest"><span class="tab-glyph">▤</span><span>依頼</span></button>
    <button class="v08-tab" data-v08-tab="facility"><span class="tab-glyph">⌂</span><span>施設</span></button>
    <button class="v08-tab" data-v08-tab="record"><span class="tab-glyph">▣</span><span>記録</span></button>
  </nav>

  <div id="v08-sheet" hidden>
    <section class="v08-panel is-active" data-v08-panel="guild">
      <div class="sheet-title"><b>ギルド管理</b><span id="v08-guild-summary">Lv.1</span></div>
      <p>日常操作はこの下部バーだけで完結　街を見ながら育てる</p>
    </section>
    <section class="v08-panel" data-v08-panel="roster">
      <div class="sheet-title"><b>冒険者</b><span id="v08-roster-summary">10 / 200</span></div>
      <p>人口上限200へ拡張中　描画人数と内部人口は分離して街の見やすさを守る</p>
    </section>
    <section class="v08-panel" data-v08-panel="quest">
      <div class="sheet-title"><b>依頼</b><span>自動進行</span></div>
      <p>冒険者は仕事を受け、帰還時に資源を持ち帰る　完了ログは上のtickerへ流れる</p>
    </section>
    <section class="v08-panel" data-v08-panel="facility">
      <div class="sheet-title"><b>施設</b><span>SELECT / UPGRADE</span></div>
      <div class="facility-grid">
        <button data-building="guild"><b>ギルド本部</b><small>強化</small></button>
        <button data-building="inn"><b>宿屋</b><small>施設API接続待ち</small></button>
        <button data-building="forge"><b>鍛冶場</b><small>施設API接続待ち</small></button>
        <button data-building="store"><b>市場</b><small>施設API接続待ち</small></button>
      </div>
    </section>
    <section class="v08-panel" data-v08-panel="record">
      <div class="sheet-title"><b>記録</b><span id="v08-save-status">AUTO SAVE</span></div>
      <button id="menu-save" class="v08-record-button">今の街を記録する</button>
    </section>
  </div>
</section>

<!-- Hidden compatibility menu: routine play no longer uses the full-screen modal. -->
<section id="menu" hidden aria-hidden="true">
  <div class="ledger menu-shell">
    <div id="menu-status">ギルド Lv.1</div>
    <button id="menu-close" type="button">閉じる</button>
  </div>
</section>

<script src="graphics.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="prototype-experience-v07.js"></script>
<script src="prototype-experience-v08.js"></script>
</body>
</html>
