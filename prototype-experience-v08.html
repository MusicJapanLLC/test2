<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#152528"><title>GUILD∞ v0.8 Bottom HUD</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-v06.css"><link rel="stylesheet" href="experience-v08.css"></head>
<body><canvas id="c" aria-label="ギルドの街"></canvas>
<header id="hud"><div class="identity"><span class="crest">∞</span><span class="brand">GUILD<span class="infinity">∞</span><small>灯の街 · LANTERN HOLLOW</small></span><b id="level">Lv.1</b></div><div class="resources"><div><small>GOLD</small><b id="gold">100</b></div><div><small>WOOD</small><b id="wood">30</b></div><div><small>FOOD</small><b id="food">18</b></div></div></header>
<div id="right"><button id="sound" class="utility" aria-label="BGMを切り替える" aria-pressed="false">♪ OFF</button><button id="speed" class="utility">×1</button><span id="speed-lock" class="speed-lock">時砂</span><button id="menu-toggle" class="utility menu-entry" hidden>MENU</button></div><div id="log"></div>
<section id="facility-strip" hidden><div><small>SELECTED FACILITY</small><strong id="facility-name">施設</strong><span id="facility-level">Lv.1</span></div><button id="facility-upgrade"><span>施設強化</span><small>Systems API待ち</small></button></section>
<aside id="bottom" class="quickbar"><button id="upgrade" class="management"><span>強化</span><small id="cost">120G</small></button><button id="hire" class="management"><span>雇用</span><small id="roster">6 / 10</small></button><button id="fever" class="management"><span>FEVER</span><small id="fever-time">20 sec</small></button><button id="facility" class="management"><span>施設</span><small>BUILD</small></button><button id="record" class="management"><span>記録</span><small>SAVE</small></button></aside>
<div id="hint">押したまま指を滑らせる：移動　建物を軽くタップ：選択</div>
<section id="menu" hidden role="dialog" aria-modal="true"><div class="ledger"><div class="menu-kicker">GUILD ARCHIVES / 03</div><h1>ギルド記録</h1><p id="menu-status" class="menu-status"></p><div class="rule"></div><p class="menu-copy">普段の操作は画面下から直接行う<br>ここは記録・設定など低頻度の情報だけに使う</p><dl><dt>MOVE</dt><dd>押したまま指を滑らせる</dd><dt>CHECK</dt><dd>建物を軽くタップ</dd><dt>COMMAND</dt><dd>画面下の常設バー</dd></dl><p class="save-note">AUTO SAVE / 15 SEC</p><button id="menu-save" class="ledger-button">街を記録する</button><button id="menu-close" class="ledger-button secondary">街へ戻る</button></div></section>
<script src="graphics.js"></script><script src="audio-v07.js"></script><script src="smooth-game-v07.js"></script><script src="experience-v08.js"></script></body></html>
