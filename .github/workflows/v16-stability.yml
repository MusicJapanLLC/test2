name: v16 stability smoke

on:
  push:
    branches:
      - legacy/v16-stability-fix
      - legacy/v16-npc-routines
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve prototype
        run: |
          python3 -m http.server 4173 >/tmp/guild-v16-http.log 2>&1 &
          sleep 2
      - name: Run stability browser tests
        run: npx playwright test tests/v16-stability.spec.mjs tests/v16-routines.spec.mjs --reporter=line --workers=1
